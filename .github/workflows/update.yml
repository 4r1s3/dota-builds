name: Обновить билды и сайт

on:
  schedule:
    - cron: "17 5 * * *"   # каждый день в 05:17 UTC
  workflow_dispatch:        # ручной запуск из вкладки Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Кеш скачанных пабов
        uses: actions/cache@v4
        with:
          path: .cache
          key: pubs-${{ github.run_id }}
          restore-keys: pubs-
      - name: Собрать данные (OpenDota + STRATZ)
        env:
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
        run: python scripts/build.py --days 30
      - name: Сбросить кеш браузера для новой версии
        run: sed -i "s/app.js\"/app.js?v=$GITHUB_RUN_ID\"/; s/style.css\"/style.css?v=$GITHUB_RUN_ID\"/; s/names-ru.js\"/names-ru.js?v=$GITHUB_RUN_ID\"/" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
